<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Study Assistant — INSAN CREATIONS</title>
  <meta name="description" content="Simple study AI: chat and assignments. SpaceXAI when INSAN Bridge is on." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/study-assistant-32.png" />
  <link rel="apple-touch-icon" href="icons/study-assistant-192.png" />
  <meta name="theme-color" content="#0b1a3a" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="icons/study-assistant-64.png" alt="" width="40" height="40" />
    <div>
      <h1>AI Study Assistant</h1>
      <p>Chat or assignments · no setup required</p>
    </div>
    <button type="button" id="btn-install" hidden>Install app</button>
  </header>

  <nav>
    <button data-tab="chat" class="on">Chat</button>
    <button data-tab="assign">Assignments</button>
  </nav>

  <main>
    <section id="chat" class="tab on">
      <p class="hint" id="ai-st">Checking SpaceXAI…</p>
      <div id="chat-log" class="out chatlog"></div>
      <form id="chat-f" class="composer">
        <textarea id="chat-q" rows="2" placeholder="Ask anything. Explain gravity. Translate this. Quiz me."></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="assign" class="tab">
      <p class="hint">Paste the question or homework. Optional: attach a text file. Not official exam papers.</p>
      <label>Assignment</label>
      <textarea id="asg-text" rows="6" placeholder="Paste the problem, worksheet text, or what you need help with."></textarea>
      <label>Text file (optional)</label>
      <input type="file" id="asg-file" accept=".txt,.md,.csv,.json" />
      <div class="row">
        <button type="button" id="asg-explain">Explain</button>
        <button type="button" id="asg-steps">Step by step</button>
        <button type="button" id="asg-hint">Hint only</button>
        <button type="button" id="asg-check">Check my answer</button>
      </div>
      <label>Your attempt (for Check)</label>
      <textarea id="asg-attempt" rows="3" placeholder="Optional — paste what you wrote so I can check mistakes."></textarea>
      <article id="asg-out" class="out"></article>
    </section>
  </main>
  <footer>INSAN CREATIONS · Understand first · Not official exam papers</footer>
  <script src="bridge-client.js"></script>
  <script src="app.js"></script>
  <script src="https://sl8722569-ux.github.io/insan-creations/js/stats.js" data-app="study-assistant"></script>
</body>
</html>
